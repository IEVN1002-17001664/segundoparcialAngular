
<div class="max-w-4xl mx-auto p-6">
  <div class="text-center mb-6">
    <h1 class="text-4xl font-bold text-blue-800">Cinépolis</h1>
    <p class="text-gray-600">La capital del cine</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="border-2 border-blue-700 rounded-lg p-5">
      <h2 class="text-2xl font-bold text-blue-700 mb-5">Entradas</h2>

      <form [formGroup]="formulario">
        <label>Nombre</label>
        <input class="border rounded-lg p-2 w-full mb-4"
          formControlName="nombre" placeholder="Ingresa tu nombre">

        <label>Cantidad de compradores</label>
        <input class="border rounded-lg p-2 w-full mb-4"
          type="number" formControlName="compradores" min="1">

        <p>¿Tiene tarjeta CINÉCO?</p>
        <label><input type="radio" formControlName="tarjeta" value="Si"> Sí</label>
        <label class="ml-4"><input type="radio" formControlName="tarjeta" value="No"> No</label>

        <label class="block mt-4">Cantidad de boletos</label>
        <input class="border rounded-lg p-2 w-full"
          type="number" formControlName="boletos" min="1">
      </form>
    </div>

    <div class="border-2 border-blue-700 rounded-lg p-5">
      <h2 class="text-2xl font-bold text-blue-700 mb-5">Salidas</h2>

      <p>Valor a pagar</p>
      <div class="bg-gray-100 rounded-lg p-3 text-xl font-bold mb-5">
        ${{ cinepolis.valorPagar }}
      </div>

      <div class="bg-blue-50 rounded-lg p-4">
        <p>Nombre: {{ cinepolis.nombre }}</p>
        <p>Compradores: {{ cinepolis.compradores }}</p>
        <p>Boletos: {{ cinepolis.boletos }}</p>
        <p>Tarjeta CINÉCO: {{ cinepolis.tarjeta }}</p>
      </div>
    </div>
  </div>

  <div class="border-2 border-blue-700 rounded-lg p-5 mt-6">
    <h2 class="text-2xl font-bold text-blue-700 mb-5">Acciones</h2>
    <div class="flex justify-center gap-4">


      <button (click)="procesar()"
        class="bg-blue-700 text-white rounded-lg px-6 py-3">
        Procesar
      </button>

      <button (click)="limpiar()"
        class="bg-yellow-500 text-white rounded-lg px-6 py-3">
        Limpiar datos
      </button>

      
<button
  type="button"
  [routerLink]="['/escuela', 'VerRegistros']"
  class="bg-purple-600 text-white rounded-lg px-6 py-3">
  Ver registros
</button>


    </div>
  </div>
</div>
